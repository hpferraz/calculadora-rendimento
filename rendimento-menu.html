<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rendimento | Módulos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#222;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(980px,94%);margin:auto;padding:14px 0 28px}.top{background:linear-gradient(115deg,#285f88,#397eae);color:#fff;padding:22px 0;box-shadow:0 3px 12px #0002}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;font-size:13px;opacity:.92}.back{margin:14px 0;border:0;border-radius:9px;background:#333;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px #00000012}.title{font-size:20px;font-weight:700;border-left:5px solid #e30613;padding-left:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mod{position:relative;border:0;border-radius:15px;padding:28px 20px;text-align:left;cursor:pointer;color:#fff;min-height:170px;box-shadow:0 6px 16px #0002;transition:.18s}.mod:hover{transform:translateY(-2px)}.red{background:#e30613}.black{background:#111}.icon{font-size:34px;margin-bottom:13px}.mod h2{margin:0 0 8px;font-size:20px}.mod p{margin:0;font-size:13px;line-height:1.45;opacity:.92}.arrow{position:absolute;right:18px;bottom:14px;font-size:24px}@media(max-width:650px){.wrap{width:94%;}.top h1{font-size:22px}.card{padding:16px}.grid{grid-template-columns:1fr}.mod{min-height:145px;padding:24px 18px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>Rendimento</h1><p>Unidade Guapiaçu</p></div></header>
<main class="wrap">
<button class="back" onclick="location.href='index.html'">← Voltar ao Painel</button>
<section class="card">
  <div class="title">Módulos de Rendimento</div>
  <div class="grid">
    <button class="mod red" onclick="location.href='rendimento.html'"><div class="icon">📈</div><h2>Painel Rendimento</h2><p>Condenações e Performance por mês ou dia.</p><span class="arrow">→</span></button>
    <button class="mod black" onclick="location.href='b100-dia.html'"><div class="icon">📊</div><h2>B100 Dia</h2><p>Visualização do Painel B100 conforme a aba Painel B100 do Excel.</p><span class="arrow">→</span></button>
  </div>
</section>
</main>
</body>
</html>
