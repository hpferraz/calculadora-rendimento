<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Especificações | Unidade Guapiaçu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f3f4f6;color:#242424}.topo{background:linear-gradient(110deg,#3b1f00,#9b6500);color:#fff;padding:24px 18px;box-shadow:0 3px 14px #0002}.wrap{width:min(1100px,94%);margin:auto}.topo h1{font-size:25px}.topo p{opacity:.9;margin-top:5px}.voltar{display:inline-block;margin:18px 0 12px;border:0;background:#333;color:#fff;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #00000012}.busca{display:flex;gap:10px}.busca input{flex:1;border:2px solid #ddd;border-radius:10px;padding:14px;font-size:18px}.busca input:focus{outline:none;border-color:#b8860b}.buscar{border:0;border-radius:10px;background:#b8860b;color:#fff;padding:0 22px;font-weight:bold;cursor:pointer}.status{font-size:13px;color:#666;margin-top:12px}.arquivos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.arquivo{border:2px solid #ddd;background:#fff;border-radius:10px;padding:14px;text-align:left;font-weight:bold;cursor:pointer;overflow-wrap:anywhere}.arquivo:hover,.arquivo.ativo{border-color:#b8860b;color:#8a6300}.viewer{display:none}.viewer.mostrar{display:block}.paginas{display:flex;flex-direction:column;gap:18px;align-items:center}.pagina{width:100%;padding:8px;background:#e8eaed;border-radius:10px;text-align:center}.pagina canvas{max-width:100%;height:auto;background:#fff}.numero{font-size:12px;font-weight:bold;color:#666;margin-bottom:7px}.progbox{max-width:560px;margin:15px auto;padding:14px;background:#f5f6f8;border-radius:10px;text-align:center}.trilho{height:12px;background:#ddd;border-radius:99px;overflow:hidden;margin:9px 0}.barra{height:100%;width:0;background:linear-gradient(90deg,#b8860b,#e3b341);transition:width .2s}.det{font-size:12px;color:#777}@media(max-width:650px){.busca{flex-direction:column}.buscar{padding:14px}.arquivos{grid-template-columns:1fr}.card{padding:15px}.topo h1{font-size:21px}}
</style>
</head>
<body>
<header class="topo"><div class="wrap"><h1>Especificações de Produtos</h1><p>Unidade Guapiaçu</p></div></header>
<main class="wrap"><button class="voltar" onclick="location.href='index.html'">← Voltar ao Painel</button>
<section class="card"><h2>Consultar SKU</h2><div class="busca"><input id="sku" inputmode="numeric" autocomplete="off" placeholder="Digite o código do SKU"><button class="buscar" onclick="buscarSKU()">BUSCAR</button></div><div id="status" class="status">Digite o SKU para localizar os PDFs da pasta correspondente.</div><div id="arquivos" class="arquivos"></div></section>
<section id="viewer" class="card viewer"><h2 id="titulo">Documento</h2><div id="paginas" class="paginas"></div></section></main>
<script type="module">
const REPO="hpferraz/calculadora-rendimento",BRANCH="especificacoes";
const API=`https://api.github.com/repos/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
const RAW=`https://raw.githubusercontent.com/${REPO}/${encodeURIComponent(BRANCH)}/`;
let arvore=null,pdfjs=null;
const el=id=>document.getElementById(id);
function limparSKU(v){return String(v||"").trim().replace(/[^0-9A-Za-z._-]/g,"")}
async function obterArvore(){if(arvore)return arvore;const r=await fetch(API,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error("GitHub respondeu HTTP "+r.status);const j=await r.json();arvore=j.tree||[];return arvore}
window.buscarSKU=async function(){const sku=limparSKU(el("sku").value);el("viewer").classList.remove("mostrar");el("arquivos").innerHTML="";if(!sku){el("status").innerText="Digite um SKU válido.";return}el("status").innerText="Procurando arquivos do SKU "+sku+"...";try{const tree=await obterArvore();const prefix=sku+"/";const files=tree.filter(x=>x.type==="blob"&&x.path.startsWith(prefix)&&x.path.toLowerCase().endsWith(".pdf")&&x.path.slice(prefix.length).indexOf("/")<0).sort((a,b)=>a.path.localeCompare(b.path,"pt-BR",{numeric:true}));if(!files.length){el("status").innerText="Nenhum PDF encontrado na pasta "+sku+".";return}el("status").innerText=files.length+" arquivo(s) encontrado(s) para o SKU "+sku+".";files.forEach(f=>{const b=document.createElement("button");b.className="arquivo";b.innerText="📄 "+f.path.split("/").pop().replace(/\.pdf$/i,"").replace(/_/g," ");b.onclick=()=>abrirPDF(f.path,b);el("arquivos").appendChild(b)})}catch(e){el("status").innerText="Erro ao consultar as especificações: "+e.message}}
el("sku").addEventListener("keydown",e=>{if(e.key==="Enter")buscarSKU()});
async function abrirPDF(path,b){document.querySelectorAll(".arquivo").forEach(x=>x.classList.remove("ativo"));b.classList.add("ativo");el("viewer").classList.add("mostrar");el("titulo").innerText=path.split("/").pop().replace(/\.pdf$/i,"").replace(/_/g," ");const out=el("paginas");out.innerHTML='<div class="progbox"><b id="pt">Preparando PDF... 0%</b><div class="trilho"><div id="pb" class="barra"></div></div><div id="pd" class="det">Baixando documento</div></div>';const pt=el("pt"),pb=el("pb"),pd=el("pd");try{pdfjs=pdfjs||await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const task=pdfjs.getDocument({url:RAW+path.split("/").map(encodeURIComponent).join("/")});task.onProgress=p=>{if(p.total){const pc=Math.min(70,Math.round(p.loaded/p.total*70));pb.style.width=pc+"%";pt.innerText="Carregando PDF... "+pc+"%"}};const pdf=await task.promise,w=Math.max(280,Math.min(document.querySelector(".wrap").clientWidth-35,1000)),mem=Number(navigator.deviceMemory||4),q=mem>=8?3.2:mem>=4?2.75:2.3,cap=mem>=8?20000000:mem>=4?15000000:11000000,prog=out.firstElementChild;for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),base=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.max(.5,Math.min(2,w/base.width))});let m=Math.max(devicePixelRatio||1,2)*q,px=vp.width*vp.height*m*m;if(px>cap)m*=Math.sqrt(cap/px);m=Math.max(2,Math.min(m,5));const d=document.createElement("div"),num=document.createElement("div"),c=document.createElement("canvas");d.className="pagina";num.className="numero";num.innerText=`Página ${n} de ${pdf.numPages}`;c.width=Math.floor(vp.width*m);c.height=Math.floor(vp.height*m);c.style.width=Math.floor(vp.width)+"px";c.style.height=Math.floor(vp.height)+"px";d.append(num,c);out.appendChild(d);const ctx=c.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";await pg.render({canvasContext:ctx,viewport:vp,transform:[m,0,0,m,0,0]}).promise;const pc=70+Math.round(n/pdf.numPages*30);pb.style.width=pc+"%";pt.innerText="Carregando PDF... "+pc+"%";pd.innerText=`Renderizando página ${n} de ${pdf.numPages}`;await new Promise(r=>setTimeout(r,0))}pt.innerText="PDF carregado - 100%";pb.style.width="100%";pd.innerText="Documento pronto";setTimeout(()=>{prog.style.display="none"},500)}catch(e){out.innerHTML='<div class="progbox">Erro ao exibir PDF: '+String(e.message||e)+'</div>'}}
</script></body></html>
