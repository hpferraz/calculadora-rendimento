</style></head><body><header class="top"><h1>Rendimento</h1><p>Unidade Guapiaçu</p></header><div class="backwrap"><button class="back" onclick="location.href='index.html'">← Voltar ao Painel</button></div><div class="top-controls"><div class="group-select"><button id="gc" class="on" onclick="setGroup('condenacoes')">Condenações</button><button id="gp" onclick="setGroup('performance')">Performance</button></div><div class="view-select"><button id="vm" class="on" onclick="setView('mes')">Mês</button><button id="vd" onclick="setView('dia')">Dia</button></div><div class="periods-wrapper"><select id="periods"></select></div></div><div id="loading"><div>Carregando dados...</div></div><div class="table-wrapper"><table id="table"></table></div><p id="status" style="text-align:center;font-size:11px;color:#666;padding:10px"></p><script>
let DATA=null,group='condenacoes',view='mes',selected=new Set();

function rgb(v){if(!v)return null;if(typeof v==='string'&&/^FF[0-9A-F]{6}$/i.test(v))return '#'+v.slice(2);if(typeof v==='string'&&/^[0-9A-F]{6}$/i.test(v))return '#'+v;return null}
function lum(h){if(!h)return 255;let v=h.replace('#',''),r=parseInt(v.slice(0,2),16),g=parseInt(v.slice(2,4),16),b=parseInt(v.slice(4,6),16);return .299*r+.587*g+.114*b}
function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}

function n(v){let x=Number(v);return Number.isFinite(x)?x:null}
function decimalsFromFmt(z){let clean=String(z||'').replace(/\"[^\"]*\"/g,'').split(';')[0],m=clean.match(/0\.([0#]+)/);return m?m[1].length:0}
function fmt(v,r,c){let x=n(v);if(x===null)return v??'';let z=r.styles[c]?.fmt||'',d=decimalsFromFmt(z);if(z.includes('%'))return (x*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});if(z.includes('0.00'))return x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});return x.toLocaleString('pt-BR')}
function lerBaseStyle(cell,s){let fill=rgb(s?.fill),font=rgb(s?.font);if(fill){cell.style.background=fill;if(lum(fill)<140)cell.classList.add('excel-dark')}if(font)cell.style.color=font}

// Regras de formatação condicional extraídas diretamente da aba Painel do Excel.
const EXCEL_CF_RULES=[{"ranges":[[5,113,16,113]],"type":"colorScale","priority":1,"cfvo":[{"type":"min","val":null},{"type":"percentile","val":"50"},{"type":"max","val":null}],"colors":["#F8696B","#FFEB9C","#C6EFCE"],"style":{}},{"ranges":[[5,4,16,4]],"type":"cellIs","priority":2,"operator":"greaterThan","formula":"10","style":{"fill":"#C6EFCE","font":null,"bold":false,"italic":false}},{"ranges":[[5,4,16,4]],"type":"cellIs","priority":3,"operator":"lessThan","formula":"7","style":{"fill":"#F8696B","font":null,"bold":false,"italic":false}}];
const cfCache=new Map();
function cellInRange(col,row,r){return col>=r[0]&&row>=r[1]&&col<=r[2]&&row<=r[3]}
function excelCol(c){return colNum(c)}
function refValue(formula,row,col){
  let f=String(formula||'').trim();
  if(/^[-+]?\d+(?:\.\d+)?$/.test(f))return Number(f);
  let m=f.match(/^\$?([A-Z]{1,3})\$?(\d+)$/i);
  if(m){let rr=Number(m[2]),cc=m[1].toUpperCase();return n(DATA?.rowsByExcel?.[rr]?.vals?.[cc]);}
  // The source rules in Painel use simple constants and $Q[row].
  return null;
}
function percentile50(a){if(!a.length)return null;let v=[...a].sort((x,y)=>x-y),p=(v.length-1)*.5,i=Math.floor(p),f=p-i;return v[i]+(v[i+1]-v[i])*f}
function ruleStats(rule){let key=JSON.stringify(rule.ranges)+'|'+JSON.stringify(rule.cfvo)+'|'+JSON.stringify(rule.colors);if(cfCache.has(key))return cfCache.get(key);let vals=[];for(let rr of rule.ranges)for(let cc=rr[0];cc<=rr[2];cc++)for(let r=rr[1];r<=rr[3];r++){let v=n(DATA.rows.find(x=>x.r===r+1)?.vals[colName(cc+1)]);if(v!==null)vals.push(v)}
 let stats={min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0,p50:percentile50(vals)};cfCache.set(key,stats);return stats}

  if(x===null||x===undefined||!Number.isFinite(x))return null;
  let st=ruleStats(rule), stops=rule.cfvo||[], colors=rule.colors||[];
  if(colors.length<2)return null;
  let points=stops.map(q=>{if(q.type==='min')return st.min;if(q.type==='max')return st.max;if(q.type==='percentile')return st.p50;if(q.type==='num')return Number(q.val);return st.min});

function applyDxf(td,style){if(!style)return;if(style.fill)td.style.background=style.fill;if(style.font)td.style.color=style.font;if(style.bold)td.style.fontWeight='700';if(style.italic)td.style.fontStyle='italic'}
function applyConditionalFormatting(td,row,col,x){
  // Start from base Excel style. Conditional rules then overlay it, exactly like Excel's
  // conditional-format layer. Multiple rules can affect the same cell; lower priority wins.
  for(let rule of [...EXCEL_CF_RULES].sort((a,b)=>b.priority-a.priority)){
    let hit=false;for(let rr of rule.ranges){if(cellInRange(col,row,rr)){hit=true;break}}if(!hit)continue;
    if(rule.type==='cellIs'){
      let target=refValue(rule.formula,row,col),ok=false;
      if(x!==null && target!==null){if(rule.operator==='lessThan')ok=x<target;else if(rule.operator==='greaterThan')ok=x>target;else if(rule.operator==='equal')ok=x===target;else if(rule.operator==='notEqual')ok=x!==target}
      if(ok)applyDxf(td,rule.style);
    }else if(rule.type==='colorScale'){
      let color=colorScaleColor(x,rule);if(color){td.style.background=color;td.style.color='#111'}
    }
  }
}
function applyBorder(td,border){
  if(!border)return;
  const side=(name)=>{let x=border[name];if(!x)return null;let st=x.style||x.styleName||'';if(!st)return null;let col=x.color?.rgb||x.color?.argb||x.color?.rgbColor||null;return {st,col}}
  for(let name of ['top','right','bottom','left']){let q=side(name);if(q){td.style['border-'+name]=q.st+' '+(q.col||'#999')}}
}
function isHeatRow(r){return false}

function render(){if(!DATA)return;loading.style.display='none';cfCache.clear();let cols=(view==='mes'?DATA.monthCols:DATA.dayCols).filter(c=>selected.has(c)),rows=DATA.rows.filter(r=>r.group===group),tbl=document.getElementById('table');tbl.innerHTML='';
let hr=document.createElement('tr');[['Indicador','c'],['Detalhe','d'],['Meta','meta'],...cols.map(c=>[view==='mes'?DATA.headers[c]:ddmm(DATA.headers[c]),''])].forEach(([x,k])=>{let th=document.createElement('th');th.textContent=x;th.className=k;hr.appendChild(th)});tbl.appendChild(hr);
let skipC=new Set(),skipD=new Set();
for(let r of rows){let tr=document.createElement('tr');if(r.separator)tr.classList.add('sep');
if(!skipC.has(r.r)){let td=document.createElement('td');td.className='c';td.textContent=r.c||'';let mg=DATA.merges.find(m=>m.s.c===2&&m.s.r===r.r-1&&m.e.c===2);if(mg){td.rowSpan=mg.e.r-mg.s.r+1;for(let _=r.r+1;_<=mg.e.r+1;_++)skipC.add(_)}tr.appendChild(td)}
if(!skipD.has(r.r)){let td=document.createElement('td');td.className='d';td.textContent=r.d||'';let mg=DATA.merges.find(m=>m.s.c===3&&m.s.r===r.r-1&&m.e.c===3);if(mg){td.rowSpan=mg.e.r-mg.s.r+1;for(let _=r.r+1;_<=mg.e.r+1;_++)skipD.add(_)}tr.appendChild(td)}
let mt=document.createElement('td');mt.className='meta';mt.textContent=fmt(r.vals[DATA.metaCol],r,DATA.metaCol);lerBaseStyle(mt,r.styles[DATA.metaCol]);applyBorder(mt,r.styles[DATA.metaCol]?.border);applyConditionalFormatting(mt,r.r,DATA.metaCol,r.vals[DATA.metaCol]);mt.style.color='#000';tr.appendChild(mt);
cols.forEach(c=>{let td=document.createElement('td'),x=n(r.vals[c]);td.textContent=fmt(r.vals[c],r,c);td.style.width='56px';td.style.minWidth='56px';td.style.maxWidth='56px';lerBaseStyle(td,r.styles[c]);applyBorder(td,r.styles[c]?.border);applyConditionalFormatting(td,r.r,c,x);tr.appendChild(td)});tbl.appendChild(tr)}
status.textContent=(group==='condenacoes'?'Condenações':'Performance')+' • '+(view==='mes'?'Meses':'Dias')+' • estrutura detectada automaticamente na aba Painel'}

async function load(){try{let res=await fetch('00.%20Rendimento%20GUA.xlsm',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let w=XLSX.read(await res.arrayBuffer(),{cellStyles:true,cellDates:true}),s=w.Sheets.Painel,range=XLSX.utils.decode_range(s['!ref']||'A1');let headerRow=3;
let headers={};for(let cc=range.s.c;cc<=range.e.c;cc++){let c=colName(cc+1);headers[c]=s[c+(headerRow+1)]?.v??''}
let metaCol=Object.keys(headers).find(c=>norm(headers[c]).toUpperCase()==='META')||'Q';let metaN=colNum(metaCol),monthCols=[],dayCols=[];for(let cc=4;cc<metaN-1;cc++){let c=colName(cc+1),h=norm(headers[c]??'');if(MES.test(h))monthCols.push(c);else if(/^\d{1,2}\/\d{1,2}$/.test(h))dayCols.push(c)}
function sty(a){let c=s[a]||{},st=c.s||{};return{fmt:c.z||'',fill:st.fgColor?.rgb||st.fill?.fgColor?.rgb||'',font:st.font?.color?.rgb||'',border:st.border||{}}}
let merges=s['!merges']||[],rows=[],dataCols=[...monthCols,...dayCols,metaCol];let start=headerRow+2,end=Math.min(143,range.e.r+1);let perfStart=null;for(let r=start;r<=end;r++){let cv=norm(s['C'+r]?.v??''),dv=norm(s['D'+r]?.v??'');if(!cv&&!dv)continue;if(cv==='PERFORMANCE'&&!perfStart){perfStart=r;continue}let row={r,c:s['C'+r]?.v??'',d:s['D'+r]?.v??'',vals:{},styles:{},group:perfStart&&r>perfStart?'performance':'condenacoes',separator:cv&&!dv};dataCols.forEach(col=>{let cell=s[col+r];row.vals[col]=cell?.v??null;row.styles[col]=sty(col+r)});rows.push(row)}
let mergedLabelByRow={};for(let m of merges){if(m.s.c!==2)continue;let top=s['C'+(m.s.r+1)]?.v??'';for(let rr=m.s.r+1;rr<=m.e.r+1;rr++)mergedLabelByRow[rr]=norm(top)}let heatRows=new Set();for(let r of s['!rows']||[]){if(r?.ht===30)heatRows.add(r)}
let rowsByExcel={};rows.forEach(r=>rowsByExcel[r.r]=r);DATA={headers,metaCol,monthCols,dayCols,rows,rowsByExcel,merges,heatRows};controls();render();status.textContent+=' • '+monthCols.length+' meses • '+dayCols.length+' dias'}catch(e){status.textContent='Erro: '+e.message}}
load();
</script></body></html>
