<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Rendimento</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            background: #f2f4f7;

            min-height: 100vh;

            padding: 30px 15px;

        }


        .container {

            max-width: 850px;

            margin: auto;

        }


        /* ============================== */
        /* CABEÇALHO */
        /* ============================== */

        .cabecalho {

            background: #ffffff;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 20px;

            text-align: center;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

        }


        .cabecalho h1 {

            font-size: 28px;

            color: #333333;

            margin-bottom: 8px;

        }


        .cabecalho p {

            color: #777777;

            font-size: 15px;

        }


        /* ============================== */
        /* CARDS */
        /* ============================== */

        .card {

            background: #ffffff;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

        }


        .titulo {

            font-size: 19px;

            font-weight: bold;

            color: #333333;

            margin-bottom: 20px;

            border-left: 5px solid #e30613;

            padding-left: 10px;

        }


        /* ============================== */
        /* CAMPOS */
        /* ============================== */

        .campo {

            margin-bottom: 20px;

        }


        .campo label {

            display: block;

            font-weight: bold;

            color: #444444;

            margin-bottom: 8px;

        }


        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cccccc;

            border-radius: 8px;

            font-size: 17px;

            outline: none;

        }


        .campo input:focus {

            border-color: #e30613;

            box-shadow: 0 0 0 2px rgba(227,6,19,0.1);

        }


        /* ============================== */
        /* FAMÍLIAS */
        /* ============================== */

        .familias {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;

        }


        .familia {

            padding: 14px 8px;

            border: 2px solid #dddddd;

            background: #ffffff;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            color: #444444;

            transition: 0.2s;

        }


        .familia:hover {

            border-color: #e30613;

            color: #e30613;

        }


        .familia.selecionada {

            background: #e30613;

            border-color: #e30613;

            color: #ffffff;

        }


        .familia-escolhida {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            color: #555555;

        }


        /* ============================== */
        /* BOTÃO CALCULAR */
        /* ============================== */

        .botao-calcular {

            width: 100%;

            padding: 17px;

            background: #e30613;

            border: none;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .botao-calcular:hover {

            background: #c90010;

        }


        /* ============================== */
        /* ERRO */
        /* ============================== */

        .erro {

            display: none;

            background: #ffe5e5;

            color: #b00000;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-weight: bold;

        }


        /* ============================== */
        /* RESULTADO */
        /* ============================== */

        .resultado {

            display: none;

        }


        .resultado-grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;

        }


        .resultado-item {

            background: #f5f6f8;

            border-radius: 10px;

            padding: 20px;

            text-align: center;

        }


        .resultado-item .descricao {

            font-size: 14px;

            color: #777777;

            margin-bottom: 8px;

        }


        .resultado-item .valor {

            font-size: 26px;

            font-weight: bold;

            color: #333333;

        }


        /* ============================== */
        /* DESTAQUE B100 */
        /* ============================== */

        .resultado-destaque {

            background: #333333;

            color: #ffffff;

        }


        .resultado-destaque .descricao {

            color: #dddddd;

        }


        .resultado-destaque .valor {

            color: #ffffff;

            font-size: 32px;

        }


        /* ============================== */
        /* DESTAQUE R$/TON */
        /* ============================== */

        .resultado-rs {

            background: #e30613;

            color: #ffffff;

        }


        .resultado-rs .descricao {

            color: #ffffff;

        }


        .resultado-rs .valor {

            color: #ffffff;

            font-size: 30px;

        }


        /* ============================== */
        /* DESTAQUE PERDA EM R$ */
        /* ============================== */

        .resultado-perda {

            background: #8b0000;

            color: #ffffff;

        }


        .resultado-perda .descricao {

            color: #ffffff;

        }


        .resultado-perda .valor {

            color: #ffffff;

            font-size: 30px;

        }


        /* ============================== */
        /* RESPONSIVO */
        /* ============================== */

        @media (max-width: 650px) {

            .familias {

                grid-template-columns: repeat(2, 1fr);

            }


            .resultado-grid {

                grid-template-columns: 1fr;

            }


            .cabecalho h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ============================== -->
    <!-- CABEÇALHO -->
    <!-- ============================== -->

    <div class="cabecalho">

        <h1>
            Calculadora de Rendimento
        </h1>

        <p>
            Balanço de Massa, B100, R$/ton e Perdas
        </p>

    </div>


    <!-- ====================================================== -->
    <!-- CONFIGURAÇÃO DAS METAS -->
    <!-- ====================================================== -->

    <script>

        const metas = {

            "Asa": 7.50,

            "Cabeça": 2.00,

            "Cartilagem": 0.20,

            "CMS": 10.20,

            "Coração": 0.40,

            "Fígado": 1.90,

            "Moela": 1.10,

            "Peito": 20.60,

            "Perna": 24.80,

            "Pé": 3.40,

            "Dorso": 2.10,

            "Gordura": 0.60,

            "Sassami": 4.20
            
        };


        // ======================================================
        // CONFIGURAÇÃO DO ROL/KG
        // ======================================================

        const rolKg = {

            "Asa": 12.54,

            "Cabeça": 1.23,

            "Cartilagem": 10.11,

            "CMS": 2.49,

            "Coração": 23.62,

            "Fígado": 2.10,

            "Moela": 9.35,

            "Peito": 12.43,

            "Perna": 8.27,

            "Pé": 16.74,

            "Dorso": 1.61,

            "Gordura": 0.36,

            "Sassami": 11.52

        };

    </script>


    <!-- ============================== -->
    <!-- DADOS DO ABATE -->
    <!-- ============================== -->

    <div class="card">

        <div class="titulo">
            Dados do Abate
        </div>


        <div class="campo">

            <label for="cabecas">
                Quantidade de cabeças abatidas
            </label>

            <input
                type="number"
                id="cabecas"
                placeholder="Ex.: 120000"
                min="0"
            >

        </div>


        <div class="campo">

            <label for="peso">
                Peso médio do frango (kg)
            </label>

            <input
                type="number"
                id="peso"
                placeholder="Ex.: 2,850"
                min="0"
                step="0.001"
            >

        </div>

    </div>


    <!-- ============================== -->
    <!-- FAMÍLIA -->
    <!-- ============================== -->

    <div class="card">

        <div class="titulo">
            Selecione a Família
        </div>


        <div class="familias">


            <button
                class="familia"
                onclick="selecionarFamilia('Asa', this)"
            >
                Asa
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Cabeça', this)"
            >
                Cabeça
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Cartilagem', this)"
            >
                Cartilagem
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('CMS', this)"
            >
                CMS
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Coração', this)"
            >
                Coração
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Fígado', this)"
            >
                Fígado
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Moela', this)"
            >
                Moela
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Peito', this)"
            >
                Peito
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Perna', this)"
            >
                Perna
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Pé', this)"
            >
                Pé
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Dorso', this)"
            >
                Dorso
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Gordura', this)"
            >
                Gordura
            </button>


            <button
                class="familia"
                onclick="selecionarFamilia('Sassami', this)"
            >
                Sassami
            </button>


        </div>


        <div
            class="familia-escolhida"
            id="familiaEscolhida"
        >

            Nenhuma família selecionada

        </div>

    </div>


    <!-- ============================== -->
    <!-- PRODUÇÃO -->
    <!-- ============================== -->

    <div class="card">

        <div class="titulo">
            Produção
        </div>


        <div class="campo">

            <label for="producao">
                Produção da família (kg)
            </label>


            <input
                type="number"
                id="producao"
                placeholder="Ex.: 8500"
                min="0"
                step="0.001"
            >

        </div>


        <div
            id="mensagemErro"
            class="erro"
        ></div>


        <button
            class="botao-calcular"
            onclick="calcular()"
        >
            CALCULAR
        </button>

    </div>


    <!-- ============================== -->
    <!-- RESULTADO -->
    <!-- ============================== -->

    <div
        class="card resultado"
        id="resultado"
    >

        <div class="titulo">
            Resultado
        </div>


        <div class="resultado-grid">


            <!-- FAMÍLIA -->

            <div class="resultado-item">

                <div class="descricao">
                    Família
                </div>

                <div
                    class="valor"
                    id="resultadoFamilia"
                >
                    -
                </div>

            </div>


            <!-- VOLUME DE ABATE -->

            <div class="resultado-item">

                <div class="descricao">
                    Volume de Abate
                </div>

                <div
                    class="valor"
                    id="resultadoAbate"
                >
                    -
                </div>

            </div>


            <!-- PRODUÇÃO -->

            <div class="resultado-item">

                <div class="descricao">
                    Produção
                </div>

                <div
                    class="valor"
                    id="resultadoProducao"
                >
                    -
                </div>

            </div>


            <!-- RENDIMENTO -->

            <div class="resultado-item">

                <div class="descricao">
                    Rendimento / Balanço de Massa
                </div>

                <div
                    class="valor"
                    id="resultadoRendimento"
                >
                    -
                </div>

            </div>


            <!-- META -->

            <div class="resultado-item">

                <div class="descricao">
                    Meta
                </div>

                <div
                    class="valor"
                    id="resultadoMeta"
                >
                    -
                </div>

            </div>


            <!-- B100 -->

            <div class="resultado-item resultado-destaque">

                <div class="descricao">
                    B100
                </div>

                <div
                    class="valor"
                    id="resultadoB100"
                >
                    -
                </div>

            </div>


            <!-- R$/TON -->

            <div class="resultado-item resultado-rs">

                <div class="descricao">
                    R$/ton
                </div>

                <div
                    class="valor"
                    id="resultadoRsTon"
                >
                    -
                </div>

            </div>


            <!-- PERDA DE PRODUTO -->

            <div class="resultado-item">

                <div class="descricao">
                    Perda de Produto
                </div>

                <div
                    class="valor"
                    id="resultadoPerdaProduto"
                >
                    -
                </div>

            </div>


            <!-- PERDA EM R$ -->

            <div class="resultado-item resultado-perda">

                <div class="descricao">
                    Perda em R$
                </div>

                <div
                    class="valor"
                    id="resultadoPerdaRs"
                >
                    -
                </div>

            </div>


        </div>

    </div>


</div>


<script>


    // ======================================================
    // VARIÁVEL DA FAMÍLIA SELECIONADA
    // ======================================================

    let familiaSelecionada = null;



    // ======================================================
    // SELECIONAR FAMÍLIA
    // ======================================================

    function selecionarFamilia(familia, botao) {


        familiaSelecionada = familia;


        const botoes =
            document.querySelectorAll(".familia");


        botoes.forEach(function(btn) {

            btn.classList.remove("selecionada");

        });


        botao.classList.add("selecionada");


        document.getElementById(
            "familiaEscolhida"
        ).innerText =
            "Família selecionada: " + familia;

    }



    // ======================================================
    // FORMATAÇÃO DE NÚMEROS
    // ======================================================

    function formatarNumero(numero, casas) {


        return numero.toLocaleString(
            "pt-BR",
            {

                minimumFractionDigits: casas,

                maximumFractionDigits: casas

            }
        );

    }



    // ======================================================
    // FUNÇÃO PRINCIPAL DE CÁLCULO
    // ======================================================

    function calcular() {


        // ==================================================
        // PEGAR VALORES DIGITADOS
        // ==================================================

        const cabecas =
            parseFloat(
                document.getElementById("cabecas").value
            );


        const peso =
            parseFloat(
                document.getElementById("peso").value
            );


        const producao =
            parseFloat(
                document.getElementById("producao").value
            );


        const erro =
            document.getElementById("mensagemErro");


        erro.style.display = "none";



        // ==================================================
        // VALIDAÇÃO DAS CABEÇAS
        // ==================================================

        if (!cabecas || cabecas <= 0) {


            mostrarErro(
                "Informe a quantidade de cabeças abatidas."
            );


            return;

        }



        // ==================================================
        // VALIDAÇÃO DO PESO
        // ==================================================

        if (!peso || peso <= 0) {


            mostrarErro(
                "Informe o peso médio do frango."
            );


            return;

        }



        // ==================================================
        // VALIDAÇÃO DA FAMÍLIA
        // ==================================================

        if (!familiaSelecionada) {


            mostrarErro(
                "Selecione uma família."
            );


            return;

        }



        // ==================================================
        // VALIDAÇÃO DA PRODUÇÃO
        // ==================================================

        if (!producao || producao < 0) {


            mostrarErro(
                "Informe a produção da família."
            );


            return;

        }



        // ==================================================
        // BUSCAR META
        // ==================================================

        const meta =
            metas[familiaSelecionada];



        if (
            meta === undefined ||
            meta <= 0
        ) {


            mostrarErro(

                "A meta da família " +
                familiaSelecionada +
                " ainda não foi cadastrada."

            );


            return;

        }



        // ==================================================
        // BUSCAR ROL/KG
        // ==================================================

        const rol =
            rolKg[familiaSelecionada];



        if (
            rol === undefined ||
            rol <= 0
        ) {


            mostrarErro(

                "O ROL/KG da família " +
                familiaSelecionada +
                " ainda não foi cadastrado."

            );


            return;

        }



        // ==================================================
        // VOLUME DE ABATE
        // ==================================================

        const volumeAbate =
            cabecas * peso;



        // ==================================================
        // RENDIMENTO
        // ==================================================

        const rendimento =
            (producao / volumeAbate) * 100;



        // ==================================================
        // B100
        // ==================================================

        const b100 =
            (rendimento / meta) * 100;



        // ==================================================
        // PRODUÇÃO ESPERADA PELA META
        // ==================================================

        const producaoMeta =
            volumeAbate * (meta / 100);



        // ==================================================
        // DIFERENÇA ENTRE PRODUÇÃO REAL E META
        // ==================================================

        const diferencaProducao =
            producao - producaoMeta;



        // ==================================================
        // R$/TON
        // ==================================================

        const rsTon =
            (
                (diferencaProducao * rol)
                /
                volumeAbate
            ) * 1000;



        // ==================================================
        // PERDA DE PRODUTO
        //
        // Se rendimento estiver abaixo da meta,
        // calcula a quantidade faltante.
        //
        // Se rendimento estiver igual ou acima da meta,
        // perda = 0.
        // ==================================================

        let perdaProduto = 0;


        if (rendimento < meta) {


            perdaProduto =
                (
                    (meta - rendimento)
                    / 100
                ) * volumeAbate;

        }



        // ==================================================
        // PERDA EM R$
        //
        // Perda de Produto × ROL/KG
        // ==================================================

        const perdaRs =
            perdaProduto * rol;



        // ==================================================
        // MOSTRAR FAMÍLIA
        // ==================================================

        document.getElementById(
            "resultadoFamilia"
        ).innerText =
            familiaSelecionada;



        // ==================================================
        // MOSTRAR VOLUME DE ABATE
        // ==================================================

        document.getElementById(
            "resultadoAbate"
        ).innerText =
            formatarNumero(
                volumeAbate,
                2
            ) + " kg";



        // ==================================================
        // MOSTRAR PRODUÇÃO
        // ==================================================

        document.getElementById(
            "resultadoProducao"
        ).innerText =
            formatarNumero(
                producao,
                2
            ) + " kg";



        // ==================================================
        // MOSTRAR RENDIMENTO
        // ==================================================

        document.getElementById(
            "resultadoRendimento"
        ).innerText =
            formatarNumero(
                rendimento,
                2
            ) + "%";



        // ==================================================
        // MOSTRAR META
        // ==================================================

        document.getElementById(
            "resultadoMeta"
        ).innerText =
            formatarNumero(
                meta,
                2
            ) + "%";



        // ==================================================
        // MOSTRAR B100
        // ==================================================

        document.getElementById(
            "resultadoB100"
        ).innerText =
            formatarNumero(
                b100,
                2
            );



        // ==================================================
        // MOSTRAR R$/TON
        // ==================================================

        document.getElementById(
            "resultadoRsTon"
        ).innerText =
            "R$ " +
            formatarNumero(
                rsTon,
                2
            );



        // ==================================================
        // MOSTRAR PERDA DE PRODUTO
        // ==================================================

        document.getElementById(
            "resultadoPerdaProduto"
        ).innerText =
            formatarNumero(
                perdaProduto,
                2
            ) + " kg";



        // ==================================================
        // MOSTRAR PERDA EM R$
        // ==================================================

        document.getElementById(
            "resultadoPerdaRs"
        ).innerText =
            "R$ " +
            formatarNumero(
                perdaRs,
                2
            );



        // ==================================================
        // MOSTRAR CARD DE RESULTADO
        // ==================================================

        document.getElementById(
            "resultado"
        ).style.display =
            "block";



        // ==================================================
        // ROLAR A TELA ATÉ O RESULTADO
        // ==================================================

        document.getElementById(
            "resultado"
        ).scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }



    // ======================================================
    // MOSTRAR ERRO
    // ======================================================

    function mostrarErro(mensagem) {


        const erro =
            document.getElementById(
                "mensagemErro"
            );


        erro.innerText =
            mensagem;


        erro.style.display =
            "block";

    }


</script>


</body>

</html>
